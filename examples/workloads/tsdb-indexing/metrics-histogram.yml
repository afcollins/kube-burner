# API server

# sum, avg, min, max, stddev, p01, p10, p25, p50, p75, p90, p99
- query: avg(irate(container_cpu_usage_seconds_total{name!="",container!~"POD|",namespace=~"openshift-.*|cilium|stackrox|calico.*|tigera.*"}[2m]) * 100) by (container)
  metricName: burner_container_cpu_irate_container_avg

- query: stddev(irate(container_cpu_usage_seconds_total{name!="",container!~"POD|",namespace=~"openshift-.*|cilium|stackrox|calico.*|tigera.*"}[2m]) * 100) by (container)
  metricName: burner_container_cpu_irate_container_stddev

- query: avg(irate(container_cpu_usage_seconds_total{name!="",container!~"POD|",namespace=~"openshift-.*|cilium|stackrox|calico.*|tigera.*"}[2m]) * 100) by (namespace)
  metricName: burner_container_cpu_irate_namespace_avg

- query: stddev(irate(container_cpu_usage_seconds_total{name!="",container!~"POD|",namespace=~"openshift-.*|cilium|stackrox|calico.*|tigera.*"}[2m]) * 100) by (namespace)
  metricName: burner_container_cpu_irate_namespace_stddev

- query: (sum(irate(container_cpu_usage_seconds_total{name!="",container!~"POD|",namespace=~"openshift-.*|cilium|stackrox|calico.*|tigera.*"}[2m]) * 100) by (container, pod, namespace, node)) > 0
  metricName: containerCPU

